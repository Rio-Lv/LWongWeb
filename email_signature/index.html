<!DOCTYPE html PUBLIC "-//W3C//DTD HTML 4.0 Transitional//EN">
<html>
  <head>
    <title>Email Signature</title>
    <meta content="text/html; charset=utf-8" http-equiv="Content-Type" />
    <link
      href="https://fonts.googleapis.com/css2?family=Poppins:wght@400;600&display=swap"
      rel="stylesheet"
    />
  </head>
  <style>
    * {
      color: black;
      --primary-color: #203972;
      --primary-color-faded: #aebfd5;

      --smaller-font-size: 11px;
      --larger-font-size: 15px;
      font-family: "Poppins", sans-serif;
      --primary-line-height: 1.6;
    }
  </style>
  <body
    style="
      font-size: var(--smaller-font-size);
      font-family: 'Poppins', sans-serif;
    "
  >
    <table
      style="width: 420px; background: transparent !important"
      cellpadding="0"
      cellspacing="0"
      border="0"
    >
      <tbody>
        <tr>
          <td
            colspan="2"
            style="font-size: 15px; line-height: 15px; height: 15px"
          >
            &nbsp;
          </td>
        </tr>
        <tr>
          <td
            colspan="2"
            style="
              font-size: 15px;
              line-height: 15px;
              height: 15px;
              border-top: 3px solid var(--primary-color-faded);
            "
          >
            &nbsp;
          </td>
        </tr>
        <tr>
          <td style="padding-right: 10px; vertical-align: top; width: 250px">
            <div
              style="
                display: flex;
                flex-direction: column;
                justify-content: space-between;
                height: 132px;
                padding: 4px;
                padding-top: 0;
              "
            >
              <div style="line-height: var(--primary-line-height)">
                <span
                  style="
                  font-size: var(--larger-font-size); 
                  font-weight: 500;
                  white-space: nowrap;
                  "
                  >%%FirstName%% %%LastName%% </span
                ><br />
                <span style="font-size: var(--smaller-font-size); font-weight: 600; text-transform: uppercase;"
                  >%%Title%%</span
                >
              </div>
              <div style="line-height: var(--primary-line-height)">
                <div style="font-size: var(--smaller-font-size)">%%Email%%</div>
                <div style="font-size: var(--smaller-font-size)">
                  %%MobileNumber%%
                </div>
                <div style="font-size: var(--smaller-font-size)">
                  %%Street%%, %%City%%, %%Country%%
                </div>
                <div style="font-size: var(--smaller-font-size)">
                  <a
                    href="http://lwongconsulting.com"
                    target="_blank"
                    style="
                      color: var(--primary-color);
                      text-decoration: underline;
                    "
                    >lwongconsulting.com</a
                  >
                </div>
              </div>
            </div>
          </td>
          <td style="vertical-align: top; padding-left: 30px">
            <img
              border="0"
              width="156"
              style="width: 156px; height: auto; border: 0"
              src="https://lwongconsulting.com/static/media/logo.125ba452.png"
              alt="Logo"
            />
          </td>
        </tr>
      </tbody>
    </table>
  </body>
</html>
