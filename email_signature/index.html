<!DOCTYPE html PUBLIC "-//W3C//DTD HTML 4.0 Transitional//EN">
<html>
  <head>
    <title>Email Signature</title>
    <meta content="text/html; charset=utf-8" http-equiv="Content-Type" />
    <link
      href="https://fonts.googleapis.com/css2?family=Poppins:wght@400;600&display=swap"
      rel="stylesheet"
    />
  </head>
  <style>
    * {
      color: black;
      --primary-color: #203972;
      font-family: "Poppins", sans-serif;
    }
  </style>
  <body style="font-size: 6.1px; font-family: 'Poppins', sans-serif">
    <table
      style="
        width: 420px;
        background: transparent !important;
      "
      cellpadding="0"
      cellspacing="0"
      border="0"
    >
      <tbody>
        <tr>
          <td
            colspan="2"
            style="font-size: 15px; line-height: 15px; height: 15px"
          >
            &nbsp;
          </td>
        </tr>
        <tr>
          <td
            colspan="2"
            style="
              font-size: 15px;
              line-height: 15px;
              height: 15px;
              border-top: 1px solid var(--primary-color);
            "
          >
            &nbsp;
          </td>
        </tr>
        <tr>
          <td style="padding-right: 10px; vertical-align: top; width: 200px;">
            <div style="display: flex; flex-direction: column; justify-content: space-between; height: 132px;">
              <div style="line-height: 1.4;">
                <span style="font-size: 10.3px; font-weight: 600;">%%FirstName%% %%LastName%%</span><br />
                <span style="font-size: 6.1px;">%%Title%%</span>
              </div>
              <div style="line-height: 1.4;">
                <div style="font-size: 6.1px;">%%Email%%</div>
                <div style="font-size: 6.1px;">%%MobileNumber%%</div>
                <div style="font-size: 6.1px;">%%Street%%, %%City%%, %%Country%%</div>
                <div style="font-size: 6.1px;"><a href="http://lwongconsulting.com" target="_blank" style="color: var(--primary-color); text-decoration: underline;">lwongconsulting.com</a></div>
              </div>
            </div>
          </td>
          <td style="vertical-align: top; padding-left: 30px;">
            <img
              border="0"
              width="132"
              style="width: 132px; height: auto; border: 0"
              src="https://lwongconsulting.com/static/media/logo.125ba452.png"
              alt="Logo"
            />
          </td>
        </tr>
      </tbody>
    </table>
  </body>
</html>
