<!DOCTYPE html PUBLIC "-//W3C//DTD HTML 4.0 Transitional//EN">
<html>
  <head>
    <title>Email Signature</title>
    <meta content="text/html; charset=utf-8" http-equiv="Content-Type" />
  </head>
  <body style="font-size: 10pt; font-family: Arial, sans-serif">
    <table
      style="
        width: 420px;
        font-size: 10pt;
        font-family: Arial, sans-serif;
        background: transparent !important;
      "
      cellpadding="0"
      cellspacing="0"
      border="0"
    >
      <tbody>
        <tr>
          <td
            colspan="2"
            style="font-size: 15px; line-height: 15px; height: 15px"
          >
            &nbsp;
          </td>
        </tr>
        <tr>
          <td
            colspan="2"
            style="
              font-size: 15px;
              line-height: 15px;
              height: 15px;
              border-top: 1px solid #345c99;
            "
          >
            &nbsp;
          </td>
        </tr>
        <tr>
          <td
            style="
              font-size: 12pt;
              font-family: Arial, sans-serif;
              width: 200px;
              padding-right: 10px;
              vertical-align: bottom;
              padding-bottom: 10px;
            "
            valign="bottom"
          >
            <p style="margin-bottom: 10px; padding-bottom: 0px; line-height: 1">
              <strong
                ><span
                  style="
                    font-size: 12pt;
                    font-family: Arial, sans-serif;
                    color: #888161;
                    line-height: 18pt;
                  "
                  >%%FirstName%% %%LastName%%</span
                ></strong
              ><span
                style="
                  font-family: Arial, sans-serif;
                  font-size: 9pt;
                  color: #345c99;
                  line-height: 14pt;
                "
                ><br />%%Title%%</span
              >
            </p>
            <span
              ><a href="https://lwongconsulting.com/" target="_blank"
                ><img
                  border="0"
                  width="132"
                  style="width: 132px; height: auto; border: 0"
                  src="https://lwongconsulting.com/static/media/logo.125ba452.png" /></a
            ></span>
          </td>
          <td
            valign="top"
            style="vertical-align: top; padding-left: 30px; padding-bottom: 6px"
          >
            <span
              ><span style="color: #345c99"><strong>Email:</strong></span
              ><a
                href="mailto:%%Email%%"
                style="
                  text-decoration: none;
                  font-size: 9pt;
                  font-family: Arial, sans-serif;
                  color: #345c99;
                "
                ><span
                  style="
                    text-decoration: none;
                    font-size: 9pt;
                    font-family: Arial, sans-serif;
                    color: #345c99;
                  "
                  >%%Email%%</span
                ></a
              ><br /></span
            ><span
              ><span style="color: #345c99"><strong>Mobile:</strong></span
              ><span
                style="
                  font-size: 9pt;
                  font-family: Arial, sans-serif;
                  color: #345c99;
                "
                >%%MobileNumber%%<br /></span></span
            ><span
              ><span style="color: #345c99"><strong>Address:</strong></span
              ><span
                style="
                  font-family: Arial, sans-serif;
                  font-size: 9pt;
                  color: #345c99;
                "
                >%%Street%%, %%City%%, %%Country%%</span
              ></span
            >
          </td>
        </tr>
        <tr></tr>
        <tr>
          <td
            style="
              vertical-align: top;
              border-top: 1px solid #345c99;
              padding-top: 15px;
            "
            valign="top"
          >
            <a
              href="http://lwongconsulting.com"
              target="_blank"
              rel="noopener"
              style="
                font-size: 9pt;
                font-family: Arial, sans-serif;
                text-decoration: none;
                color: #888161;
                font-weight: bold;
              "
              ><span
                style="
                  font-size: 9pt;
                  font-family: Arial, sans-serif;
                  text-decoration: none;
                  color: #888161;
                  font-weight: bold;
                "
                >lwongconsulting.com</span
              ></a
            >
          </td>
          <td
            valign="top"
            align="right"
            style="
              padding-left: 30px;
              border-top: 1px solid #345c99;
              padding-top: 15px;
              text-align: right;
            "
          >
            <table
              cellpadding="0"
              cellspacing="0"
              border="0"
              style="float: right; background: transparent !important"
            >
              <tbody>
                <tr>
                  <td style="padding-left: 3px" width="30">
                    <a href="https://www.facebook.com/MyCompany" target="_blank"
                      ><img
                        border="0"
                        width="26"
                        height="22"
                        style="border: 0; height: 22px; width: 26px"
                        src="https://www.mail-signatures.com/signature-generator/img/templates/organic-coffee/fb.png"
                    /></a>
                  </td>
                  <td style="padding-left: 3px" width="30">
                    <a href="https://twitter.com/MyCompany404" target="_blank"
                      ><img
                        border="0"
                        width="26"
                        height="22"
                        style="border: 0; height: 22px; width: 26px"
                        src="https://www.mail-signatures.com/signature-generator/img/templates/organic-coffee/tt.png"
                    /></a>
                  </td>
                  <td style="padding-left: 3px" width="30">
                    <a
                      href="https://www.youtube.com/user/MyCompanyChannel"
                      target="_blank"
                      ><img
                        border="0"
                        width="26"
                        height="22"
                        style="border: 0; height: 22px; width: 26px"
                        src="https://www.mail-signatures.com/signature-generator/img/templates/organic-coffee/yt.png"
                    /></a>
                  </td>
                  <td style="padding-left: 3px" width="30">
                    <a
                      href="https://www.linkedin.com/company/mycompany404"
                      target="_blank"
                      ><img
                        border="0"
                        width="26"
                        height="22"
                        style="border: 0; height: 22px; width: 26px"
                        src="https://www.mail-signatures.com/signature-generator/img/templates/organic-coffee/ln.png"
                    /></a>
                  </td>
                  <td style="padding-left: 3px" width="30">
                    <a
                      href="https://www.instagram.com/mycompany404/"
                      target="_blank"
                      ><img
                        border="0"
                        width="26"
                        height="22"
                        style="border: 0; height: 22px; width: 26px"
                        src="https://www.mail-signatures.com/signature-generator/img/templates/organic-coffee/it.png"
                    /></a>
                  </td>
                </tr>
              </tbody>
            </table>
          </td>
        </tr>
      </tbody>
    </table>
    <div
      style="width: 420px; height: 180px; overflow: hidden; padding-top: 16px"
    >
      <img
        src="https://shorturl.at/8qSVm"
        style="border: 0; width: 100%; height: 100%; object-fit: cover"
        alt="Residential Office Building"
      />
    </div>
    <div
      style="
        width: 420px;
        font-size: 7pt;
        font-family: Arial, sans-serif;
        font-style: italic;
        color: #888161;
      "
    >
      Confidential and privileged information. Unauthorized use, disclosure, or
      copying prohibited.
    </div>
  </body>
</html>
