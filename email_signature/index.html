<!DOCTYPE html PUBLIC "-//W3C//DTD HTML 4.0 Transitional//EN">
<html>
  <head>
    <title>Email Signature</title>
    <meta content="text/html; charset=utf-8" http-equiv="Content-Type" />
  </head>
  <style>
    * {
      color: black;
      --primary-color: #203972;
    }
  </style>
  <body style="font-size: 10pt; font-family: Arial, sans-serif">
    <table
      style="
        width: 420px;
        font-size: 10pt;
        font-family: Arial, sans-serif;
        background: transparent !important;
      "
      cellpadding="0"
      cellspacing="0"
      border="0"
    >
      <tbody>
        <tr>
          <td
            colspan="2"
            style="font-size: 15px; line-height: 15px; height: 15px"
          >
            &nbsp;
          </td>
        </tr>
        <tr>
          <td
            colspan="2"
            style="
              font-size: 15px;
              line-height: 15px;
              height: 15px;
              border-top: 1px solid var(--primary-color);
            "
          >
            &nbsp;
          </td>
        </tr>
        <tr>
          <td
            style="
              font-size: 12pt;
              font-family: Arial, sans-serif;
              width: 200px;
              padding-right: 10px;
              vertical-align: bottom;
              padding-bottom: 10px;
            "
            valign="bottom"
          >
            <p style="margin-bottom: 10px; padding-bottom: 0px; line-height: 1">
              <strong
                ><span
                  style="
                    font-size: 12pt;
                    font-family: Arial, sans-serif;
                    line-height: 18pt;
                  "
                  >%%FirstName%% %%LastName%%</span
                ></strong
              ><span
                style="
                  font-family: Arial, sans-serif;
                  font-size: 9pt;
                  line-height: 14pt;
                "
                ><br />%%Title%%</span
              >
            </p>
            <span
              ><a
                style="color: var(--primary-color)"
                href="https://lwongconsulting.com/"
                target="_blank"
                ><img
                  border="0"
                  width="132"
                  style="width: 132px; height: auto; border: 0"
                  src="https://lwongconsulting.com/static/media/logo.125ba452.png" /></a
            ></span>
          </td>
          <td
            valign="top"
            style="vertical-align: top; padding-left: 30px; padding-bottom: 6px"
          >
            <span
              style="
                text-decoration: none;
                font-size: 9pt;
                font-family: Arial, sans-serif;
              "
              >%%Email%%</span
            >
            <span style="font-size: 9pt; font-family: Arial, sans-serif"
              >%%MobileNumber%%
            </span>
            <span style="font-family: Arial, sans-serif; font-size: 9pt"
              >%%Street%%, %%City%%, %%Country%%
            </span>
          </td>
        </tr>
        <tr></tr>
        <tr>
          <td style="vertical-align: top; padding-top: 15px" valign="top">
            <a
              href="http://lwongconsulting.com"
              target="_blank"
              rel="noopener"
              style="
                font-size: 9pt;
                font-family: Arial, sans-serif;
                text-decoration: none;
                color: var(--primary-color);
                font-weight: bold;
              "
              ><span
                style="
                  font-size: 9pt;
                  font-family: Arial, sans-serif;
                  text-decoration: none;
                  color: var(--primary-color);
                  font-weight: bold;
                "
                >lwongconsulting.com</span
              ></a
            >
          </td>
        </tr>
      </tbody>
    </table>
  </body>
</html>
