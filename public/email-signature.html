<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<title>Email Signature</title>
<link href="https://fonts.googleapis.com/css2?family=Poppins:wght@400;600&display=swap" rel="stylesheet">
<style>
  .signature-wrapper {
    display: flex;
    align-items: flex-start;
    font-family: 'Poppins', sans-serif;
  }
  .signature-left {
    display: flex;
    flex-direction: column;
    justify-content: space-between;
    margin-right: 10px;
  }
  .top-group,
  .bottom-group {
    line-height: 1.4;
  }
  .name {
    font-size: 10.3px;
    font-weight: 600;
  }
  .title,
  .contact-item {
    font-size: 6.1px;
  }
  .bottom-group .contact-item {
    margin-top: 0.2em;
  }
  .website a {
    color: #0D0D0D;
    text-decoration: underline;
  }
</style>
</head>
<body>
  <div class="signature-wrapper">
    <div class="signature-left">
      <div class="top-group">
        <div class="name">First Last</div>
        <div class="title">Job Title</div>
      </div>
      <div class="bottom-group">
        <div class="contact-item">email@example.com</div>
        <div class="contact-item">+1 555-555-5555</div>
        <div class="contact-item">123 Street, City</div>
        <div class="contact-item website"><a href="https://example.com">example.com</a></div>
      </div>
    </div>
    <div class="signature-logo">
      <img src="../src/logo.png" alt="Logo" style="height:60px;" />
    </div>
  </div>
</body>
</html>
